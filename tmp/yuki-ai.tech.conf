server {
    listen 80;
    server_name yuki-ai.tech www.yuki-ai.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yuki-ai.tech www.yuki-ai.tech;

    ssl_certificate /www/server/nginx/conf/ssl/yuki-ai.tech.pem;
    ssl_certificate_key /www/server/nginx/conf/ssl/yuki-ai.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Yuki Bot — Telegram webhook only (IP whitelist)
    location /webhook {
        # Telegram server IPs
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Yuki AI Server (all other routes)
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
